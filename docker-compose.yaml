services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novacommerce-backend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    environment:
      - APP_NAME="${APP_NAME:-NovaCommerce}"
      - APP_PORT=${APP_PORT:-8080}
      - APP_ENV="${APP_ENV:-development}"